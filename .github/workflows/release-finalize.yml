name: Release — Finalize on merge

# Second half of the release. Fires when a `release/v*` PR is merged into main
# (squash merge is fine — the squash commit carries .changes/<v>.md). It tests
# and builds that commit, tags it, and publishes the GitHub release with the
# linux/amd64 archive, checksums and install.sh. It never pushes to main: all
# release content already landed via the merged PR. Merging only queues this
# job: the protected `release` environment requires the repository owner's
# approval before the App credential is exposed or anything is published.
#
# Trigger: the push of the merge to main, not the PR's `closed` event. A
# pull_request job runs on refs/pull/<n>/merge, which the `release`
# environment's deployment branch policy (main only) rejects before the job
# starts — there is no bypass for it. A push to main (and a manual dispatch
# from main) runs on refs/heads/main and satisfies the policy unchanged.
#
# Gate: the `detect` job (no environment, read-only) decides whether a push is
# a release. The release commit is the newest first-parent commit on main that
# added .changes/<v>.md, and it must be the merge commit of a merged
# same-repo `release/v<v>` PR into main — the same provenance the old
# pull_request gate checked. Pushes that add no .changes/X.Y.Z.md skip
# finalize; anything inconsistent fails closed.
#
# Recovery: Actions -> "Release — Finalize on merge" -> Run workflow on main
# with the version re-runs detect + finalize for an already-merged release PR
# (e.g. one whose finalize failed or was rejected).
#
# Idempotency: the "verify version state" step first checks whether a
# v<version> tag already exists and, if so, requires it to point at the
# release commit — a foreign tag is a hard failure in every state, never
# something to build a release on or to skip past. It then distinguishes three
# states so a re-run (e.g. after a transient failure) does the right thing
# instead of either erroring out or double-publishing:
#   1. release exists and its tag was verified above -> full no-op. A release
#      whose tag is missing is a hard failure, not a no-op.
#   2. tag exists (verified) but the release is missing -> only the release is
#      created; the tag push is skipped.
#   3. neither exists -> push the annotated tag, then create the release.
# Every remote probe fails closed: a lookup error stops the run rather than
# being read as "absent".

on:
  push:
    branches: [main]
    # Only pushes that touch a released-version file can be a release; every
    # other push to main never starts this workflow.
    paths:
      - ".changes/*.md"
  workflow_dispatch:
    inputs:
      version:
        description: "Already-merged release to finalize, no leading v (e.g. 0.3.0). Run from main."
        required: true
        type: string

# Least-privilege: the default GITHUB_TOKEN stays read-only at the workflow
# level; the finalize job elevates to contents:write as belt-and-suspenders for
# softprops/action-gh-release. The tag push and the release creation
# themselves use the App token.
permissions:
  contents: read

# Concurrency is declared on the finalize job, not the workflow: a
# workflow-level group would also queue pushes that turn out not to be
# releases. See `finalize.concurrency`.

jobs:
  detect:
    name: Detect release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read the PR associated with the release commit (provenance check).
      pull-requests: read
    outputs:
      version: ${{ steps.detect.outputs.version }}
      release_sha: ${{ steps.detect.outputs.release_sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Find the release commit and verify its PR
        id: detect
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          INPUT_VERSION: ${{ inputs.version }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Same canonical form release-prepare.yml and the PR guard enforce:
          # plain integer components, no leading zeros. Re-checked here so a
          # zero-padded version (1.0.00) can never reach tagging even when
          # this post-merge backstop is the only guard that ran.
          SEMVER_RE='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'

          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::finalize only runs from main (got $REF)."; exit 1
          fi

          if [ "$EVENT" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            # Versions this push added. A force-push or first push leaves
            # BEFORE unusable; fall back to the pushed commit's first parent.
            if ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              BEFORE="$SHA^1"
            fi
            # Loose pattern so a zero-padded file is still caught (and then
            # rejected by SEMVER_RE) rather than silently ignored.
            added="$(git diff --name-only --diff-filter=A "$BEFORE" "$SHA" -- .changes/ \
              | sed -n 's|^\.changes/\([0-9][0-9]*\.[0-9][0-9]*\.[0-9][0-9]*\)\.md$|\1|p')"
            count="$(printf '%s' "$added" | grep -c . || true)"
            if [ "$count" -eq 0 ]; then
              echo "::notice::push adds no .changes/X.Y.Z.md — not a release, nothing to finalize."
              exit 0
            fi
            if [ "$count" -ne 1 ]; then
              echo "::error::push adds more than one released version ($(echo $added)); finalize each by hand via workflow_dispatch."
              exit 1
            fi
            version="$added"
          fi

          if ! printf '%s' "$version" | grep -Eq "$SEMVER_RE"; then
            echo "::error::version must be canonical X.Y.Z (no leading v, no zero-padded components). Got: '$version'"; exit 1
          fi

          # The release commit is the newest first-parent commit on main that
          # added .changes/<v>.md (first-parent, so commits inside a merged
          # branch never count — only what landed on main itself).
          release_sha="$(git log --first-parent --diff-filter=A --format=%H -n1 "$SHA" -- ".changes/$version.md")"
          if [ -z "$release_sha" ]; then
            echo "::error::no commit on main adds .changes/$version.md."; exit 1
          fi
          if ! git cat-file -e "$SHA:.changes/$version.md" 2>/dev/null; then
            echo "::error::.changes/$version.md no longer exists on main."; exit 1
          fi

          # Provenance: the release commit must be the merge commit of a
          # merged, same-repo release/v<version> PR into main. Release PRs are
          # always opened by release-prepare.yml, so a hand-pushed changelog
          # or a fork PR with a crafted branch name never gets past here. The
          # API call fails the step on error (fail closed).
          prs="$(gh api "repos/$REPO/commits/$release_sha/pulls")"
          match="$(printf '%s' "$prs" | jq -r \
            --arg sha "$release_sha" --arg head "release/v$version" --arg repo "$REPO" \
            '[.[] | select(.merged_at != null and .merge_commit_sha == $sha
                           and .base.ref == "main" and .head.ref == $head
                           and .head.repo.full_name == $repo)] | .[0].number // empty')"
          if [ -z "$match" ]; then
            echo "::error::$release_sha (adds .changes/$version.md) is not the merge commit of a merged release/v$version PR into main. Refusing to release."
            exit 1
          fi

          echo "::notice::release v$version: commit $release_sha from PR #$match."
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  finalize:
    name: Finalize release
    needs: detect
    if: needs.detect.outputs.version != ''
    environment: release
    # One global FIFO queue for every genuine finalize run, across versions.
    # That serialization is what makes the monotonic backstop in "Verify
    # version state" sound: two release PRs merged close together would
    # otherwise both probe the same old tag set, and the older version could
    # still tag and publish last. `queue: max` keeps up to 100 pending runs
    # instead of the default one, so a newly queued finalize can never cancel
    # a pending one — at worst it waits its turn.
    #
    # The group expression repeats the `if` gate: only a detected release can
    # name the shared group; every other run gets a run-unique group of its
    # own, so it can neither displace a queued release nor fill its queue.
    concurrency:
      group: >-
        ${{ needs.detect.outputs.version != ''
            && 'release-finalize'
            || format('release-finalize-skip-{0}', github.run_id) }}
      cancel-in-progress: false
      queue: max
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Mint a least-privilege token (omitting this grants the App's full
          # installation set): finalize only pushes the tag and creates the
          # release, both under contents. Checkout persists this token into
          # .git/config, where later steps can read it — keep its scope minimal.
          permission-contents: write

      - name: Check out the release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.detect.outputs.release_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Verify version state
        id: v
        env:
          VERSION: ${{ needs.detect.outputs.version }}
          RELEASE_SHA: ${{ needs.detect.outputs.release_sha }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          version="$VERSION"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          # Belt-and-suspenders: the checked-out content must carry the version.
          if [ ! -f ".changes/$version.md" ]; then
            echo "::error::.changes/$version.md missing on the release commit"; exit 1
          fi

          # The existence probes below must distinguish "absent" from
          # "errored": a transient API failure has to fail the run, not
          # silently reroute the state machine into re-creating (or skipping)
          # things. Pattern: `rc=0; cmd || rc=$?` keeps errexit on and captures
          # the exit code.

          # Tag probe. (git ls-remote --exit-code: 0 = ref found, 2 = no match,
          # anything else = the lookup itself failed.) An existing tag must
          # point at the release commit — checked here, before any state
          # is chosen, so no state can succeed on a foreign tag.
          rc=0; git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null 2>&1 || rc=$?
          case "$rc" in
            0) tag_exists=true ;;
            2) tag_exists=false ;;
            *) echo "::error::git ls-remote for tag v$version failed (exit $rc)."; exit 1 ;;
          esac
          if [ "$tag_exists" = true ]; then
            git fetch origin "refs/tags/v$version:refs/tags/v$version"
            tag_commit="$(git rev-parse "v$version^{commit}")"
            if [ "$tag_commit" != "$RELEASE_SHA" ]; then
              echo "::error::tag v$version already exists but points at $tag_commit," \
                "not the release commit ($RELEASE_SHA). Refusing to overwrite a foreign tag."
              exit 1
            fi
          fi

          # Release probe. `gh release view` exits 1 with "release not found"
          # when absent; any other failure is an error. Both the exit code and
          # the message are required so that e.g. a missing `gh` binary (exit
          # 127, "command not found") cannot be read as "absent".
          rc=0; release_err="$(gh release view "v$version" 2>&1 >/dev/null)" || rc=$?
          if [ "$rc" -eq 0 ]; then
            release_exists=true
          elif [ "$rc" -eq 1 ] && printf '%s' "$release_err" | grep -qi 'release not found'; then
            release_exists=false
          else
            echo "::error::gh release view v$version failed: $release_err"; exit 1
          fi

          # State 1: release exists. It only counts as "already finalized"
          # when its tag exists and was verified above to point at this merge
          # commit. A release without that tag (a draft, or one whose tag was
          # since deleted — a moved tag already failed the check above) is not
          # ours to skip past.
          if [ "$release_exists" = true ]; then
            if [ "$tag_exists" != true ]; then
              echo "::error::release v$version exists but tag v$version does not, so it cannot have been" \
                "cut from the release commit ($RELEASE_SHA). Resolve manually before re-running."
              exit 1
            fi
            echo "::notice::release v$version already exists and its tag matches the release commit — nothing to finalize."
            echo "do_tag=false" >> "$GITHUB_OUTPUT"
            echo "do_release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # State 2: tag exists (verified) but the release is missing ->
          # create the release only.
          if [ "$tag_exists" = true ]; then
            echo "::notice::tag v$version already exists and matches the release commit — skipping tag push, creating release."
            echo "do_tag=false" >> "$GITHUB_OUTPUT"
            echo "do_release=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # State 3: neither exists -> push the tag and create the release.
          # Monotonic backstop for the prepare-side guard: refuse to tag a
          # version at or below the newest existing v* tag, so merging two
          # open release PRs out of order fails closed instead of publishing
          # a downgrade. Only meaningful here — in states 1 and 2 this
          # version's own tag already exists. The enumeration itself must
          # fail closed: a lookup error is an error, not "no tags yet".
          rc=0; tag_list="$(git ls-remote --tags origin 'refs/tags/v*')" || rc=$?
          if [ "$rc" -ne 0 ]; then
            echo "::error::git ls-remote --tags origin failed (exit $rc); cannot verify version monotonicity."
            exit 1
          fi
          # awk (not grep) so an empty tag set is a clean empty result rather
          # than a non-zero pipeline under pipefail. The anchored regex also
          # drops peeled '^{}' entries. It is deliberately looser than
          # SEMVER_RE: a hand-made zero-padded tag (v1.0.00) still counts
          # towards the floor, so the same numeric version cannot be cut
          # again beneath it.
          newest="$(printf '%s\n' "$tag_list" \
            | awk '$2 ~ /^refs\/tags\/v[0-9]+\.[0-9]+\.[0-9]+$/ { sub(/^refs\/tags\/v/, "", $2); print $2 }' \
            | sort -V | tail -n1)"
          if [ -n "$newest" ]; then
            highest="$(printf '%s\n%s\n' "$version" "$newest" | sort -V | tail -n1)"
            if [ "$highest" != "$version" ]; then
              echo "::error::version $version is not greater than the newest existing tag v$newest; refusing to publish a downgrade. If this out-of-order merge is intentional, tag and release manually."
              exit 1
            fi
          fi
          echo "do_tag=true" >> "$GITHUB_OUTPUT"
          echo "do_release=true" >> "$GITHUB_OUTPUT"

      # Prove the exact release commit passes tests and builds before its tag is
      # published, so a failure here leaves no tag or release behind.
      - name: Set up Go
        if: steps.v.outputs.do_release == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Run release verification checks
        if: steps.v.outputs.do_release == 'true'
        run: |
          sh -n scripts/install.sh
          go test -race -count=1 ./...

      - name: Build Linux and macOS archives and checksums
        if: steps.v.outputs.do_release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -eu

          tag="v$VERSION"
          short_commit=$(git rev-parse --short HEAD)
          # Keep all builds inside the serialized, approved finalize job.
          # security(1) is used at runtime on macOS, so no CGO SDK is needed.
          for target in linux/amd64 darwin/amd64 darwin/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="agent-quota_${VERSION}_${os}_${arch}"
            package_dir="dist/$name"
            mkdir -p "$package_dir"

            GOOS="$os" GOARCH="$arch" CGO_ENABLED=0 \
              go build \
              -trimpath \
              -ldflags="-s -w -X github.com/rudolfjs/agent-quota/internal/version.buildVersion=$tag -X github.com/rudolfjs/agent-quota/internal/version.buildCommit=$short_commit" \
              -o "$package_dir/agent-quota" \
              ./cmd/agent-quota/

            cp LICENSE README.md "$package_dir/"
            tar -C dist -czf "dist/${name}.tar.gz" "$name"
          done
          (cd dist && sha256sum -- *.tar.gz > checksums.txt)

      - name: Tag the release commit
        if: steps.v.outputs.do_tag == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

      - name: Prepare release notes
        if: steps.v.outputs.do_release == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: cp ".changes/$VERSION.md" release-notes.md

      - name: Create GitHub release
        if: steps.v.outputs.do_release == 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ steps.v.outputs.version }}
          body_path: release-notes.md
          generate_release_notes: false
          token: ${{ steps.app-token.outputs.token }}
          files: |
            dist/*.tar.gz
            dist/checksums.txt
            scripts/install.sh
